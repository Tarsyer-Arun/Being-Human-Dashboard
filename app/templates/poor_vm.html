{% extends "base.html" %}
{% block title %}Poor VM{% endblock %}
{% block page_title %}<i class="fa-solid fa-shirt" style="color:var(--primary);margin-right:8px"></i>Poor VM —
Being Human Dashboard

{% endblock %}

{% block content %}
<!-- Filter Bar -->
<div class="filter-bar">
  <label>From</label>
  <input type="date" id="dateFrom" />
  <label>To</label>
  <input type="date" id="dateTo" />
  <label>Camera</label>
  <select id="cameraFilter"
    style="padding:5px 6px;border:1px solid #d1d5db;border-radius:6px;font-size:12px;font-family:inherit;color:#374151;">
    <option value="">All</option>
  </select>
  <button class="btn btn-primary" onclick="applyFilters()"><i class="fa-solid fa-magnifying-glass"></i> Apply</button>
  <button class="quick-btn" onclick="setRange(0)">Today</button>
  <button class="quick-btn" onclick="setYesterday()">Yesterday</button>
  <button class="quick-btn" onclick="setRange(6)">7 Days</button>
  <button class="quick-btn active" id="btn30" onclick="setRange(29)">30 Days</button>
  <button class="quick-btn" onclick="setRange(89)">90 Days</button>
</div>

<div class="content" id="mainContent" style="display:flex;flex-direction:column;">

  <div style="margin-bottom:10px;flex-shrink:0;">
    <div style="font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:6px;">
      <i class="fa-solid fa-shirt" style="font-size:10px;"></i> Poor VM — Selected Period
    </div>
    <div class="chip-row" id="summaryChips">
      <div class="spinner" style="width:18px;height:18px;border-width:2px;margin:0;"></div>
    </div>
  </div>

  <div class="card" style="flex:1;display:flex;flex-direction:column;min-height:0;padding:0;overflow:hidden;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--border);">
      <div class="card-title" style="margin:0;">
        <i class="fa-solid fa-triangle-exclamation" style="color:var(--primary);margin-right:6px;font-size:11px;"></i>
        Messy Hotspot Alerts
      </div>
      <span id="alertCountBadge" class="badge badge-blue">Loading…</span>
    </div>
    <div id="alertsGridWrap" style="flex:1;overflow-y:auto;min-height:0;">
      <div style="display:flex;align-items:center;justify-content:center;height:100%;min-height:200px;">
        <div class="spinner"></div>
      </div>
    </div>
  </div>

</div>
{% endblock %}

{% block scripts %}
<style>
  .pv-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
    padding: 16px;
  }
  .pv-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: var(--bg);
    transition: box-shadow .2s, transform .2s;
  }
  .pv-card:hover { box-shadow: 0 4px 14px rgba(15,23,42,0.1); transform: translateY(-2px); }
  .pv-thumb {
    aspect-ratio: 16/9; background:#000; overflow:hidden;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .pv-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
</style>
<script>
  function todayStr() { return new Date().toISOString().slice(0, 10); }
  function offsetDate(days) {
    const d = new Date(); d.setDate(d.getDate() - days);
    return d.toISOString().slice(0, 10);
  }
  function setRange(daysBack) {
    document.getElementById('dateFrom').value = offsetDate(daysBack);
    document.getElementById('dateTo').value = todayStr();
    document.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    loadAll();
  }
  function setYesterday() {
    const y = offsetDate(1);
    document.getElementById('dateFrom').value = y;
    document.getElementById('dateTo').value = y;
    document.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    loadAll();
  }
  function applyFilters() {
    document.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('active'));
    loadAll();
  }
  function allParams() {
    const from = document.getElementById('dateFrom').value;
    const to = document.getElementById('dateTo').value;
    const camera = document.getElementById('cameraFilter').value;
    const storeCode = window.currentStoreCode || 'BH-01';
    let qs = `from=${from}&to=${to}&store_code=${storeCode}`;
    if (camera) qs += `&camera_no=${encodeURIComponent(camera)}`;
    return qs;
  }

  function animateValue(el, target) {
    target = target || 0;
    const current = parseInt((el.textContent || '').replace(/[^\d-]/g, ''), 10);
    const startVal = isNaN(current) ? 0 : current;
    const token = (el._animToken = (el._animToken || 0) + 1);
    if (startVal === target) { el.textContent = target.toLocaleString(); return; }
    const duration = 450, start = performance.now();
    function tick(now) {
      if (el._animToken !== token) return;
      const p = Math.min(1, (now - start) / duration);
      el.textContent = Math.round(startVal + (target - startVal) * (1 - Math.pow(1 - p, 3))).toLocaleString();
      if (p < 1) requestAnimationFrame(tick);
      else el.textContent = target.toLocaleString();
    }
    requestAnimationFrame(tick);
  }
  function renderSummaryChips(total) {
    const el = document.getElementById('summaryChips');
    if (!el.dataset.built) {
      el.innerHTML = `
        <span class="chip chip-red"><i class="fa-solid fa-triangle-exclamation" style="font-size:10px;"></i> Total Alerts: <strong id="sc-total">0</strong></span>
      `;
      el.dataset.built = '1';
    }
    animateValue(document.getElementById('sc-total'), total);
  }

  function fmtTime(dt) {
    if (!dt) return '—';
    const d = new Date(dt.replace(' ', 'T'));
    if (isNaN(d.getTime())) return dt;
    return d.toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
  }

  function populateCameraFilter(cameras) {
    const sel = document.getElementById('cameraFilter');
    const current = sel.value;
    sel.innerHTML = '<option value="">All</option>' +
      (cameras || []).map(c => `<option value="${c}">Camera ${c}</option>`).join('');
    if (cameras && cameras.includes(Number(current))) sel.value = current;
  }

  function renderAlerts(alerts) {
    const wrap = document.getElementById('alertsGridWrap');
    if (!alerts || alerts.length === 0) {
      wrap.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:center;height:100%;min-height:260px;flex-direction:column;gap:12px;color:var(--muted);">
          <i class="fa-solid fa-circle-check" style="font-size:42px;opacity:0.3;color:var(--green);"></i>
          <div style="font-size:14px;font-weight:600;">No alerts</div>
          <div style="font-size:12px;">No messy hotspot alerts in the selected period.</div>
        </div>
      `;
      return;
    }
    wrap.innerHTML = `<div class="pv-grid">
      ${alerts.map(a => `
        <div class="pv-card">
          <div class="pv-thumb" ${a.image_url ? `onclick="viewAlertImage('${a.image_url}', '${(a.date_time || '').replace(/'/g, '')}')"` : ''}>
            ${a.image_url
              ? `<img src="${a.image_url}" alt="Poor VM alert" loading="lazy">`
              : `<i class="fa-solid fa-image" style="color:#555;font-size:22px;"></i>`}
          </div>
          <div style="padding:9px 11px;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;">
              <span style="font-size:12px;font-weight:600;color:var(--text);">Camera ${a.camera_no != null && a.camera_no !== '' ? a.camera_no : '—'}</span>
              <span class="badge badge-red" style="font-size:9.5px;">poor_vm</span>
            </div>
            <div style="font-size:11px;color:var(--muted);">${fmtTime(a.date_time)}</div>
          </div>
        </div>
      `).join('')}
    </div>`;
  }

  function ensureImageModal() {
    let modal = document.getElementById('alertImageModal');
    if (modal) return modal;
    modal = document.createElement('div');
    modal.id = 'alertImageModal';
    modal.style.cssText = 'display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:1000;align-items:center;justify-content:center;';
    modal.innerHTML = `
      <div style="background:#fff;border-radius:8px;padding:12px;max-width:90vw;max-height:90vh;position:relative;">
        <button onclick="closeAlertImageModal()" style="position:absolute;top:-14px;right:-14px;width:28px;height:28px;border-radius:50%;border:none;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,0.3);cursor:pointer;font-size:14px;">✕</button>
        <div id="alertImageModalCaption" style="font-size:12px;font-weight:600;color:var(--text);margin-bottom:8px;"></div>
        <div id="alertImageModalBody" style="min-width:200px;min-height:150px;display:flex;align-items:center;justify-content:center;">
          <div class="spinner"></div>
        </div>
      </div>
    `;
    modal.addEventListener('click', (e) => { if (e.target === modal) closeAlertImageModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAlertImageModal(); });
    document.body.appendChild(modal);
    return modal;
  }
  function closeAlertImageModal() {
    const modal = document.getElementById('alertImageModal');
    if (modal) modal.style.display = 'none';
  }
  function viewAlertImage(url, caption) {
    const modal = ensureImageModal();
    document.getElementById('alertImageModalCaption').textContent = caption || '';
    document.getElementById('alertImageModalBody').innerHTML =
      `<img src="${url}" style="max-width:85vw;max-height:80vh;display:block;border-radius:4px;" onerror="this.parentNode.innerHTML='<div style=&quot;color:var(--muted);font-size:13px;padding:20px;&quot;>Failed to load image.</div>'" />`;
    modal.style.display = 'flex';
  }

  async function loadAlerts() {
    try {
      const res = await fetch(`/api/poor-vm-alerts?${allParams()}`);
      const d = await res.json();
      renderSummaryChips(d.total || 0);
      populateCameraFilter(d.cameras || []);
      renderAlerts(d.alerts || []);
      document.getElementById('alertCountBadge').textContent = `${d.total || 0} Alerts`;
      document.getElementById('alertCountBadge').className = (d.total || 0) > 0 ? 'badge badge-red' : 'badge badge-green';
    } catch (e) {
      document.getElementById('summaryChips').innerHTML =
        '<span style="color:var(--red);font-size:12px;">Failed to load</span>';
      document.getElementById('alertCountBadge').textContent = 'Error';
      document.getElementById('alertCountBadge').className = 'badge badge-gray';
      renderAlerts([]);
    }
  }

  function loadAll() {
    if (!window.currentStoreCode) {
      document.getElementById('mainContent').innerHTML = `
        <div style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:16px;color:var(--muted);">
          <i class="fa-solid fa-store" style="font-size:48px;opacity:0.3;"></i>
          <div style="font-size:14px;font-weight:500;">Please select a store to view data</div>
        </div>
      `;
      return;
    }
    loadAlerts();
  }

  (function init() {
    document.getElementById('dateFrom').value = offsetDate(29);
    document.getElementById('dateTo').value = todayStr();
    document.getElementById('cameraFilter').addEventListener('change', loadAll);

    const checkStoreInterval = setInterval(() => {
      if (window.currentStoreCode !== undefined) {
        clearInterval(checkStoreInterval);
        loadAll();
      }
    }, 50);

    const storeDropdown = document.getElementById('globalStoreCode');
    storeDropdown.addEventListener('change', loadAll);
  })();
</script>
{% endblock %}
