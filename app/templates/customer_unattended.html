{% extends "base.html" %}
{% block title %}Customer Unattended{% endblock %}
{% block page_title %}<i class="fa-solid fa-user-clock" style="color:var(--primary);margin-right:8px"></i>Customer Unattended —
Being Human Dashboard

{% endblock %}

{% block content %}
<!-- Filter Bar -->
<div class="filter-bar">
  <label>From</label>
  <input type="date" id="dateFrom" />
  <label>To</label>
  <input type="date" id="dateTo" />
  <label>Hour</label>
  <select id="hourFrom"
    style="padding:5px 6px;border:1px solid #d1d5db;border-radius:6px;font-size:12px;font-family:inherit;color:#374151;"></select>
  <span style="color:var(--muted);font-size:12px;">–</span>
  <select id="hourTo"
    style="padding:5px 6px;border:1px solid #d1d5db;border-radius:6px;font-size:12px;font-family:inherit;color:#374151;"></select>
  <button class="btn btn-primary" onclick="applyFilters()"><i class="fa-solid fa-magnifying-glass"></i> Apply</button>
  <button class="quick-btn" onclick="setRange(0)">Today</button>
  <button class="quick-btn" onclick="setYesterday()">Yesterday</button>
  <button class="quick-btn" onclick="setRange(6)">7 Days</button>
  <button class="quick-btn active" id="btn30" onclick="setRange(29)">30 Days</button>
  <button class="quick-btn" onclick="setRange(89)">90 Days</button>
</div>

<div class="content" id="mainContent" style="display:flex;flex-direction:column;">

  <div style="margin-bottom:10px;flex-shrink:0;">
    <div style="font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:6px;">
      <i class="fa-solid fa-user-clock" style="font-size:10px;"></i> Customer Unattended — Selected Period
    </div>
    <div class="chip-row" id="summaryChips">
      <div class="spinner" style="width:18px;height:18px;border-width:2px;margin:0;"></div>
    </div>
  </div>

  <div class="card" style="flex:1;display:flex;flex-direction:column;min-height:0;">
    <div class="card-title">
      <i class="fa-solid fa-triangle-exclamation" style="color:var(--primary);margin-right:6px;font-size:11px;"></i>
      Alerts
    </div>
    <div id="alertsBody" style="flex:1;overflow-y:auto;min-height:0;">
      <div class="spinner"></div>
    </div>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script>
  function todayStr() { return new Date().toISOString().slice(0, 10); }
  function offsetDate(days) {
    const d = new Date(); d.setDate(d.getDate() - days);
    return d.toISOString().slice(0, 10);
  }
  function setRange(daysBack) {
    document.getElementById('dateFrom').value = offsetDate(daysBack);
    document.getElementById('dateTo').value = todayStr();
    document.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    loadAll();
  }
  function setYesterday() {
    const y = offsetDate(1);
    document.getElementById('dateFrom').value = y;
    document.getElementById('dateTo').value = y;
    document.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    loadAll();
  }
  function applyFilters() {
    document.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('active'));
    loadAll();
  }
  function allParams() {
    const from = document.getElementById('dateFrom').value;
    const to = document.getElementById('dateTo').value;
    const hourFrom = document.getElementById('hourFrom').value;
    const hourTo = document.getElementById('hourTo').value;
    const storeCode = window.currentStoreCode || 'BH-01';
    return `from=${from}&to=${to}&hour_from=${hourFrom}&hour_to=${hourTo}&store_code=${storeCode}`;
  }

  function animateValue(el, target) {
    target = target || 0;
    const current = parseInt((el.textContent || '').replace(/[^\d-]/g, ''), 10);
    const startVal = isNaN(current) ? 0 : current;
    const token = (el._animToken = (el._animToken || 0) + 1);
    if (startVal === target) { el.textContent = target.toLocaleString(); return; }
    const duration = 450, start = performance.now();
    function tick(now) {
      if (el._animToken !== token) return; // superseded by a newer animation
      const p = Math.min(1, (now - start) / duration);
      el.textContent = Math.round(startVal + (target - startVal) * (1 - Math.pow(1 - p, 3))).toLocaleString();
      if (p < 1) requestAnimationFrame(tick);
      else el.textContent = target.toLocaleString();
    }
    requestAnimationFrame(tick);
  }
  function renderSummaryChips(total) {
    const el = document.getElementById('summaryChips');
    if (!el.dataset.built) {
      el.innerHTML = `
        <span class="chip chip-red"><i class="fa-solid fa-triangle-exclamation" style="font-size:10px;"></i> Total Alerts: <strong id="sc-total">0</strong></span>
      `;
      el.dataset.built = '1';
    }
    animateValue(document.getElementById('sc-total'), total);
  }

  function renderAlerts(alerts) {
    const body = document.getElementById('alertsBody');
    if (!alerts || alerts.length === 0) {
      body.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:center;height:100%;min-height:260px;flex-direction:column;gap:12px;color:var(--muted);">
          <i class="fa-solid fa-circle-check" style="font-size:42px;opacity:0.3;color:var(--green);"></i>
          <div style="font-size:14px;font-weight:600;">No alerts</div>
          <div style="font-size:12px;">No customers were left unattended in the selected period.</div>
        </div>
      `;
      return;
    }
    body.innerHTML = `
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Date / Time</th><th>Store</th><th>Camera</th><th>Alert Type</th></tr>
          </thead>
          <tbody>
            ${alerts.map(a => `
              <tr>
                <td>${a.date_time || '-'}</td>
                <td>${a.store_code || '-'}</td>
                <td>${a.camera_no || '-'}</td>
                <td><span class="badge badge-red">${a.alert_type || 'Customer Unattended'}</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  async function loadAlerts() {
    try {
      const res = await fetch(`/api/customer-unattended?${allParams()}`);
      const d = await res.json();
      renderSummaryChips(d.total || 0);
      renderAlerts(d.alerts || []);
    } catch (e) {
      document.getElementById('summaryChips').innerHTML =
        '<span style="color:var(--red);font-size:12px;">Failed to load</span>';
      renderAlerts([]);
    }
  }

  function loadAll() {
    if (!window.currentStoreCode) {
      document.getElementById('mainContent').innerHTML = `
        <div style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:16px;color:var(--muted);">
          <i class="fa-solid fa-store" style="font-size:48px;opacity:0.3;"></i>
          <div style="font-size:14px;font-weight:500;">Please select a store to view data</div>
        </div>
      `;
      return;
    }
    loadAlerts();
  }

  (function init() {
    const hf = document.getElementById('hourFrom');
    const ht = document.getElementById('hourTo');
    for (let h = 9; h <= 22; h++) {
      hf.add(new Option(String(h).padStart(2, '0') + ':00', h));
    }
    for (let h = 10; h <= 23; h++) {
      ht.add(new Option(String(h).padStart(2, '0') + ':00', h));
    }
    hf.value = 9;
    ht.value = 23;
    document.getElementById('dateFrom').value = offsetDate(29);
    document.getElementById('dateTo').value = todayStr();

    const checkStoreInterval = setInterval(() => {
      if (window.currentStoreCode !== undefined) {
        clearInterval(checkStoreInterval);
        loadAll();
      }
    }, 50);

    const storeDropdown = document.getElementById('globalStoreCode');
    storeDropdown.addEventListener('change', loadAll);
  })();
</script>
{% endblock %}
